# Generated by genai-interlingua: interlingua -emit ottl -dialect braintrust -target v1.41.0
#
# Normalizes braintrust spans into the v1.41.0 gen_ai.* schema, using only the mappings
# that can be stated as data. It is a subset of what the genai-interlingua
# processor does, and the differences are listed below rather than discovered.
#
# WHAT THIS CARRIES (9 attributes)
#
#   gen_ai.provider.name
#   gen_ai.request.model                       (emitted conformant; no statement needed)
#   gen_ai.response.model                      (emitted conformant; no statement needed)
#   gen_ai.usage.input_tokens                  (PARTIAL; see below)
#   gen_ai.usage.output_tokens                 (PARTIAL; see below)
#   gen_ai.input.messages                      (emitted conformant; no statement needed)
#   gen_ai.output.messages                     (emitted conformant; no statement needed)
#   gen_ai.operation.name                      (PARTIAL; see below)
#   gen_ai.tool.definitions
#
# WHAT THIS CARRIES ONLY SOMETIMES (3 attributes)
#
#   This emitter writes these facts two ways: as the conventions' own
#   attributes, which the statements below handle, and inside its own
#   private structures, which they cannot. A span of the first kind comes
#   out complete. A span of the second comes out missing the attribute
#   entirely, with nothing on it to say so.
#
#   They are listed in interlingua.export.unsupported as well. Being
#   named here is not a weaker warning than being named there -- it is
#   the same warning with a reason attached. Do not trust these.
#
#   gen_ai.operation.name
#   gen_ai.usage.input_tokens
#   gen_ai.usage.output_tokens
#
# WHAT THIS CANNOT CARRY (4 attributes)
#
#   These come from reading the span rather than transforming a value --
#   reassembling indexed message attributes into one document, lifting
#   fields out of a JSON blob, deciding what an attribute means by looking
#   at a sibling. OTTL has no loop and no argmax; none of it is expressible.
#   Spans leaving this processor carry the same list in
#   interlingua.export.unsupported, so it is queryable and not just documented.
#
#   gen_ai.evaluation.name
#   gen_ai.evaluation.score.value
#   gen_ai.usage.cache_read.input_tokens
#   gen_ai.usage.reasoning.output_tokens
#
#   For those, run the processor: https://github.com/Grace/genai-interlingua
#
# TWO THINGS TO KNOW BEFORE INSTALLING THIS
#
# 1. It does not detect anything. The processor scores every dialect against
#    the span and takes the winner; that needs a loop and a maximum, and OTTL
#    has neither. This config is pinned to braintrust and scoped by the conditions
#    below, which only ask whether the span carries attributes of the right
#    shape. If more than one GenAI library reports into this pipeline, route
#    by service first -- these conditions will not tell them apart.
#
# 2. It does not compute interlingua.lossy. That list is per-span, derived
#    from what a given span turned out to carry. What is emitted instead is
#    interlingua.export.unsupported: the same statement made structurally,
#    about the config rather than about the span.
#
# 3. It is not idempotent the way the processor is. The processor leaves a
#    span alone entirely once it already carries the requested target; the
#    transform processor ORs the conditions below, so there is no config
#    scoped way to express "and not already done" without repeating the
#    guard on every statement. What that costs is bounded on purpose:
#    interlingua.dialect is guarded and will not be overwritten, and
#    interlingua.hops counts up, so a span through this config twice says
#    2 rather than quietly looking like a span through it once.

processors:
  transform/interlingua_braintrust:
    # A span missing an attribute is the normal case, not an error.
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - attributes["braintrust.context_json"] != nil
          - attributes["braintrust.expected_json"] != nil
          - attributes["braintrust.input_json"] != nil
          - attributes["braintrust.metadata"] != nil
          - attributes["braintrust.metrics"] != nil
          - attributes["braintrust.output_json"] != nil
          - attributes["braintrust.scores"] != nil
          - attributes["braintrust.span_attributes"] != nil
          - attributes["braintrust.tags"] != nil
          - attributes["gen_ai.agent.tools"] != nil
          - attributes["gen_ai.system"] != nil
          - attributes["gen_ai.usage.completion_tokens"] != nil
          - attributes["gen_ai.usage.prompt_tokens"] != nil
        statements:
          - set(attributes["gen_ai.provider.name"], attributes["gen_ai.system"]) where attributes["gen_ai.provider.name"] == nil and attributes["gen_ai.system"] != nil
          - delete_key(attributes, "gen_ai.provider.name") where attributes["gen_ai.system"] != nil and attributes["gen_ai.provider.name"] != nil and not IsMatch(attributes["gen_ai.provider.name"], "^(anthropic|aws\\.bedrock|azure\\.ai\\.inference|azure\\.ai\\.openai|cohere|deepseek|gcp\\.gemini|gcp\\.gen_ai|gcp\\.vertex_ai|groq|ibm\\.watsonx\\.ai|mistral_ai|openai|perplexity|x_ai)$")
          - set(attributes["gen_ai.usage.input_tokens"], attributes["gen_ai.usage.prompt_tokens"]) where attributes["gen_ai.usage.input_tokens"] == nil and attributes["gen_ai.usage.prompt_tokens"] != nil
          - set(attributes["gen_ai.usage.output_tokens"], attributes["gen_ai.usage.completion_tokens"]) where attributes["gen_ai.usage.output_tokens"] == nil and attributes["gen_ai.usage.completion_tokens"] != nil
          - set(attributes["gen_ai.tool.definitions"], attributes["gen_ai.agent.tools"]) where attributes["gen_ai.agent.tools"] != nil
          - set(attributes["interlingua.dialect"], "braintrust") where attributes["interlingua.dialect"] == nil
          - set(attributes["interlingua.target"], "v1.41.0")
          - set(attributes["interlingua.hops"], attributes["interlingua.hops"] + 1) where attributes["interlingua.hops"] != nil
          - set(attributes["interlingua.hops"], 1) where attributes["interlingua.hops"] == nil
          - set(attributes["interlingua.export"], "ottl")
          - set(attributes["interlingua.export.unsupported"], ["gen_ai.evaluation.name", "gen_ai.evaluation.score.value", "gen_ai.operation.name", "gen_ai.usage.cache_read.input_tokens", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens", "gen_ai.usage.reasoning.output_tokens"])
          - set(attributes["interlingua.export.partial"], ["gen_ai.operation.name", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens"])
