# Generated by genai-interlingua: interlingua -emit ottl -dialect litellm -target genai-main
#
# Normalizes litellm spans into the genai-main gen_ai.* schema, using only the mappings
# that can be stated as data. It is a subset of what the genai-interlingua
# processor does, and the differences are listed below rather than discovered.
#
# WHAT THIS CARRIES (20 attributes)
#
#   gen_ai.provider.name
#   gen_ai.operation.name
#   gen_ai.request.model                       (emitted conformant; no statement needed)
#   gen_ai.response.model                      (emitted conformant; no statement needed)
#   gen_ai.request.max_tokens                  (emitted conformant; no statement needed)
#   gen_ai.request.temperature                 (emitted conformant; no statement needed)
#   gen_ai.request.top_p                       (emitted conformant; no statement needed)
#   gen_ai.request.top_k                       (emitted conformant; no statement needed)
#   gen_ai.request.seed                        (emitted conformant; no statement needed)
#   gen_ai.request.frequency_penalty           (emitted conformant; no statement needed)
#   gen_ai.request.presence_penalty            (emitted conformant; no statement needed)
#   gen_ai.request.stop_sequences              (emitted conformant; no statement needed)
#   gen_ai.request.stream                      (emitted conformant; no statement needed)
#   gen_ai.request.choice.count                (emitted conformant; no statement needed)
#   gen_ai.usage.input_tokens                  (emitted conformant; no statement needed)
#   gen_ai.usage.output_tokens                 (emitted conformant; no statement needed)
#   gen_ai.usage.cache_write.input_tokens
#   gen_ai.usage.cache_read.input_tokens       (emitted conformant; no statement needed)
#   gen_ai.system_instructions                 (emitted conformant; no statement needed)
#   gen_ai.conversation.id                     (emitted conformant; no statement needed)
#
# WHAT THIS CANNOT CARRY (4 attributes)
#
#   These come from reading the span rather than transforming a value --
#   reassembling indexed message attributes into one document, lifting
#   fields out of a JSON blob, deciding what an attribute means by looking
#   at a sibling. OTTL has no loop and no argmax; none of it is expressible.
#   Spans leaving this processor carry the same list in
#   interlingua.export.unsupported, so it is queryable and not just documented.
#
#   gen_ai.input.messages
#   gen_ai.output.messages
#   gen_ai.response.finish_reasons
#   gen_ai.tool.definitions
#
#   For those, run the processor: https://github.com/Grace/genai-interlingua
#
# TWO THINGS TO KNOW BEFORE INSTALLING THIS
#
# 1. It does not detect anything. The processor scores every dialect against
#    the span and takes the winner; that needs a loop and a maximum, and OTTL
#    has neither. This config is pinned to litellm and scoped by the conditions
#    below, which only ask whether the span carries attributes of the right
#    shape. If more than one GenAI library reports into this pipeline, route
#    by service first -- these conditions will not tell them apart.
#
# 2. It does not compute interlingua.lossy. That list is per-span, derived
#    from what a given span turned out to carry. What is emitted instead is
#    interlingua.export.unsupported: the same statement made structurally,
#    about the config rather than about the span.

processors:
  transform/interlingua_litellm:
    # A span missing an attribute is the normal case, not an error.
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - attributes["gen_ai.system"] != nil
          - attributes["gen_ai.usage.cache_creation.input_tokens"] != nil
          - attributes["llm.request.type"] != nil
        statements:
          - set(attributes["gen_ai.provider.name"], attributes["gen_ai.system"]) where attributes["gen_ai.provider.name"] == nil and attributes["gen_ai.system"] != nil
          - set(attributes["gen_ai.provider.name"], ToLowerCase(attributes["gen_ai.provider.name"])) where attributes["gen_ai.provider.name"] != nil
          - set(attributes["interlingua.__scratch"], "azure.ai.openai") where attributes["gen_ai.provider.name"] == "azure"
          - set(attributes["interlingua.__scratch"], "azure.ai.inference") where attributes["gen_ai.provider.name"] == "azure_ai"
          - set(attributes["interlingua.__scratch"], "aws.bedrock") where attributes["gen_ai.provider.name"] == "bedrock"
          - set(attributes["interlingua.__scratch"], "gcp.gemini") where attributes["gen_ai.provider.name"] == "gemini"
          - set(attributes["interlingua.__scratch"], "mistral_ai") where attributes["gen_ai.provider.name"] == "mistral"
          - set(attributes["interlingua.__scratch"], "gcp.vertex_ai") where attributes["gen_ai.provider.name"] == "vertex_ai"
          - set(attributes["interlingua.__scratch"], "ibm.watsonx.ai") where attributes["gen_ai.provider.name"] == "watsonx"
          - set(attributes["interlingua.__scratch"], "ibm.watsonx.ai") where attributes["gen_ai.provider.name"] == "watsonx_text"
          - set(attributes["interlingua.__scratch"], "x_ai") where attributes["gen_ai.provider.name"] == "xai"
          - set(attributes["gen_ai.provider.name"], attributes["interlingua.__scratch"]) where attributes["interlingua.__scratch"] != nil
          - delete_key(attributes, "interlingua.__scratch")
          - delete_key(attributes, "gen_ai.provider.name") where attributes["gen_ai.system"] != nil and attributes["gen_ai.provider.name"] != nil and not IsMatch(attributes["gen_ai.provider.name"], "^(anthropic|aws\\.bedrock|azure\\.ai\\.inference|azure\\.ai\\.openai|cohere|deepseek|gcp\\.gemini|gcp\\.gen_ai|gcp\\.vertex_ai|groq|ibm\\.watsonx\\.ai|mistral_ai|moonshot_ai|openai|perplexity|x_ai)$")
          - set(attributes["gen_ai.operation.name"], attributes["llm.request.type"]) where attributes["gen_ai.operation.name"] == nil and attributes["llm.request.type"] != nil
          - set(attributes["interlingua.__scratch"], "chat") where attributes["gen_ai.operation.name"] == "acompletion"
          - set(attributes["interlingua.__scratch"], "embeddings") where attributes["gen_ai.operation.name"] == "aembedding"
          - set(attributes["interlingua.__scratch"], "text_completion") where attributes["gen_ai.operation.name"] == "atext_completion"
          - set(attributes["interlingua.__scratch"], "chat") where attributes["gen_ai.operation.name"] == "completion"
          - set(attributes["interlingua.__scratch"], "embeddings") where attributes["gen_ai.operation.name"] == "embedding"
          - set(attributes["gen_ai.operation.name"], attributes["interlingua.__scratch"]) where attributes["interlingua.__scratch"] != nil
          - delete_key(attributes, "interlingua.__scratch")
          - delete_key(attributes, "gen_ai.operation.name") where attributes["llm.request.type"] != nil and attributes["gen_ai.operation.name"] != nil and not IsMatch(attributes["gen_ai.operation.name"], "^(chat|create_agent|create_memory|create_memory_store|delete_memory|delete_memory_store|embeddings|execute_tool|fetch_response|generate_content|invoke_agent|invoke_workflow|plan|retrieval|search_memory|text_completion|update_memory|upsert_memory)$")
          - set(attributes["gen_ai.usage.cache_write.input_tokens"], attributes["gen_ai.usage.cache_creation.input_tokens"]) where attributes["gen_ai.usage.cache_creation.input_tokens"] != nil
          - set(attributes["interlingua.dialect"], "litellm")
          - set(attributes["interlingua.target"], "genai-main")
          - set(attributes["interlingua.export"], "ottl")
          - set(attributes["interlingua.export.unsupported"], ["gen_ai.input.messages", "gen_ai.output.messages", "gen_ai.response.finish_reasons", "gen_ai.tool.definitions"])
