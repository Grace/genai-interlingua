# Generated by genai-interlingua: interlingua -emit ottl -dialect openllmetry -target genai-main
#
# Normalizes openllmetry spans into the genai-main gen_ai.* schema, using only the mappings
# that can be stated as data. It is a subset of what the genai-interlingua
# processor does, and the differences are listed below rather than discovered.
#
# WHAT THIS CARRIES (20 attributes)
#
#   gen_ai.provider.name
#   gen_ai.request.model                       (emitted conformant; no statement needed)
#   gen_ai.response.model                      (emitted conformant; no statement needed)
#   gen_ai.response.id                         (emitted conformant; no statement needed)
#   gen_ai.request.max_tokens                  (emitted conformant; no statement needed)
#   gen_ai.request.temperature                 (emitted conformant; no statement needed)
#   gen_ai.request.top_p                       (emitted conformant; no statement needed)
#   gen_ai.request.top_k
#   gen_ai.request.frequency_penalty
#   gen_ai.request.presence_penalty
#   gen_ai.request.stop_sequences
#   gen_ai.request.stream
#   gen_ai.usage.input_tokens
#   gen_ai.usage.output_tokens
#   gen_ai.usage.cache_write.input_tokens
#   gen_ai.usage.cache_read.input_tokens
#   gen_ai.usage.reasoning.output_tokens
#   gen_ai.workflow.name
#   gen_ai.prompt.name
#   gen_ai.prompt.version
#
# WHAT THIS CANNOT CARRY (7 attributes)
#
#   These come from reading the span rather than transforming a value --
#   reassembling indexed message attributes into one document, lifting
#   fields out of a JSON blob, deciding what an attribute means by looking
#   at a sibling. OTTL has no loop and no argmax; none of it is expressible.
#   Spans leaving this processor carry the same list in
#   interlingua.export.unsupported, so it is queryable and not just documented.
#
#   gen_ai.agent.name
#   gen_ai.input.messages
#   gen_ai.operation.name
#   gen_ai.output.messages
#   gen_ai.response.finish_reasons
#   gen_ai.tool.definitions
#   gen_ai.tool.name
#
#   For those, run the processor: https://github.com/Grace/genai-interlingua
#
# TWO THINGS TO KNOW BEFORE INSTALLING THIS
#
# 1. It does not detect anything. The processor scores every dialect against
#    the span and takes the winner; that needs a loop and a maximum, and OTTL
#    has neither. This config is pinned to openllmetry and scoped by the conditions
#    below, which only ask whether the span carries attributes of the right
#    shape. If more than one GenAI library reports into this pipeline, route
#    by service first -- these conditions will not tell them apart.
#
# 2. It does not compute interlingua.lossy. That list is per-span, derived
#    from what a given span turned out to carry. What is emitted instead is
#    interlingua.export.unsupported: the same statement made structurally,
#    about the config rather than about the span.
#
# 3. It is not idempotent the way the processor is. The processor leaves a
#    span alone entirely once it already carries the requested target; the
#    transform processor ORs the conditions below, so there is no config
#    scoped way to express "and not already done" without repeating the
#    guard on every statement. What that costs is bounded on purpose:
#    interlingua.dialect is guarded and will not be overwritten, and
#    interlingua.hops counts up, so a span through this config twice says
#    2 rather than quietly looking like a span through it once.

processors:
  transform/interlingua_openllmetry:
    # A span missing an attribute is the normal case, not an error.
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - attributes["gen_ai.is_streaming"] != nil
          - attributes["gen_ai.system"] != nil
          - attributes["gen_ai.usage.cache_creation_input_tokens"] != nil
          - attributes["gen_ai.usage.cache_read_input_tokens"] != nil
          - attributes["gen_ai.usage.completion_tokens"] != nil
          - attributes["gen_ai.usage.prompt_tokens"] != nil
          - attributes["gen_ai.usage.reasoning_tokens"] != nil
          - attributes["llm.chat.stop_sequences"] != nil
          - attributes["llm.frequency_penalty"] != nil
          - attributes["llm.is_streaming"] != nil
          - attributes["llm.presence_penalty"] != nil
          - attributes["llm.top_k"] != nil
          - attributes["traceloop.entity.input"] != nil
          - attributes["traceloop.entity.name"] != nil
          - attributes["traceloop.entity.output"] != nil
          - attributes["traceloop.prompt.key"] != nil
          - attributes["traceloop.prompt.version"] != nil
          - attributes["traceloop.span.kind"] != nil
          - attributes["traceloop.workflow.name"] != nil
        statements:
          - set(attributes["gen_ai.provider.name"], attributes["gen_ai.system"]) where attributes["gen_ai.provider.name"] == nil and attributes["gen_ai.system"] != nil
          - set(attributes["gen_ai.provider.name"], ToLowerCase(attributes["gen_ai.provider.name"])) where attributes["gen_ai.provider.name"] != nil
          - delete_key(attributes, "gen_ai.provider.name") where attributes["gen_ai.system"] != nil and attributes["gen_ai.provider.name"] != nil and not IsMatch(attributes["gen_ai.provider.name"], "^(anthropic|aws\\.bedrock|azure\\.ai\\.inference|azure\\.ai\\.openai|cohere|deepseek|gcp\\.gemini|gcp\\.gen_ai|gcp\\.vertex_ai|groq|ibm\\.watsonx\\.ai|mistral_ai|moonshot_ai|openai|perplexity|x_ai)$")
          - set(attributes["gen_ai.request.top_k"], attributes["llm.top_k"]) where attributes["llm.top_k"] != nil
          - set(attributes["gen_ai.request.frequency_penalty"], attributes["llm.frequency_penalty"]) where attributes["gen_ai.request.frequency_penalty"] == nil and attributes["llm.frequency_penalty"] != nil
          - set(attributes["gen_ai.request.presence_penalty"], attributes["llm.presence_penalty"]) where attributes["gen_ai.request.presence_penalty"] == nil and attributes["llm.presence_penalty"] != nil
          - set(attributes["gen_ai.request.stop_sequences"], attributes["llm.chat.stop_sequences"]) where attributes["llm.chat.stop_sequences"] != nil
          - set(attributes["gen_ai.request.stream"], attributes["gen_ai.is_streaming"]) where attributes["gen_ai.is_streaming"] != nil
          - set(attributes["gen_ai.request.stream"], attributes["llm.is_streaming"]) where attributes["gen_ai.is_streaming"] == nil and attributes["llm.is_streaming"] != nil
          - set(attributes["gen_ai.usage.input_tokens"], attributes["gen_ai.usage.prompt_tokens"]) where attributes["gen_ai.usage.prompt_tokens"] != nil
          - set(attributes["gen_ai.usage.output_tokens"], attributes["gen_ai.usage.completion_tokens"]) where attributes["gen_ai.usage.completion_tokens"] != nil
          - set(attributes["gen_ai.usage.cache_write.input_tokens"], attributes["gen_ai.usage.cache_creation_input_tokens"]) where attributes["gen_ai.usage.cache_creation_input_tokens"] != nil
          - set(attributes["gen_ai.usage.cache_read.input_tokens"], attributes["gen_ai.usage.cache_read_input_tokens"]) where attributes["gen_ai.usage.cache_read_input_tokens"] != nil
          - set(attributes["gen_ai.usage.reasoning.output_tokens"], attributes["gen_ai.usage.reasoning_tokens"]) where attributes["gen_ai.usage.reasoning_tokens"] != nil
          - set(attributes["gen_ai.workflow.name"], attributes["traceloop.workflow.name"]) where attributes["traceloop.workflow.name"] != nil
          - set(attributes["gen_ai.prompt.name"], attributes["traceloop.prompt.key"]) where attributes["traceloop.prompt.key"] != nil
          - set(attributes["gen_ai.prompt.version"], attributes["traceloop.prompt.version"]) where attributes["traceloop.prompt.version"] != nil
          - set(attributes["interlingua.dialect"], "openllmetry") where attributes["interlingua.dialect"] == nil
          - set(attributes["interlingua.target"], "genai-main")
          - set(attributes["interlingua.hops"], attributes["interlingua.hops"] + 1) where attributes["interlingua.hops"] != nil
          - set(attributes["interlingua.hops"], 1) where attributes["interlingua.hops"] == nil
          - set(attributes["interlingua.export"], "ottl")
          - set(attributes["interlingua.export.unsupported"], ["gen_ai.agent.name", "gen_ai.input.messages", "gen_ai.operation.name", "gen_ai.output.messages", "gen_ai.response.finish_reasons", "gen_ai.tool.definitions", "gen_ai.tool.name"])
