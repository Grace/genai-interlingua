# Generated by genai-interlingua: interlingua -emit ottl -dialect vercel -target genai-main
#
# Normalizes vercel spans into the genai-main gen_ai.* schema, using only the mappings
# that can be stated as data. It is a subset of what the genai-interlingua
# processor does, and the differences are listed below rather than discovered.
#
# WHAT THIS CARRIES (21 attributes)
#
#   gen_ai.provider.name
#   gen_ai.operation.name
#   gen_ai.request.model
#   gen_ai.request.max_tokens
#   gen_ai.request.temperature                 (emitted conformant; no statement needed)
#   gen_ai.request.top_p                       (emitted conformant; no statement needed)
#   gen_ai.request.top_k                       (emitted conformant; no statement needed)
#   gen_ai.request.frequency_penalty           (emitted conformant; no statement needed)
#   gen_ai.request.presence_penalty            (emitted conformant; no statement needed)
#   gen_ai.request.stop_sequences              (emitted conformant; no statement needed)
#   gen_ai.response.id
#   gen_ai.response.model
#   gen_ai.usage.input_tokens
#   gen_ai.usage.output_tokens
#   gen_ai.response.finish_reasons
#   gen_ai.response.time_to_first_chunk
#   gen_ai.workflow.name
#   gen_ai.tool.name
#   gen_ai.tool.call.id
#   gen_ai.tool.call.arguments
#   gen_ai.tool.call.result
#
# WHAT THIS CANNOT CARRY (4 attributes)
#
#   These come from reading the span rather than transforming a value --
#   reassembling indexed message attributes into one document, lifting
#   fields out of a JSON blob, deciding what an attribute means by looking
#   at a sibling. OTTL has no loop and no argmax; none of it is expressible.
#   Spans leaving this processor carry the same list in
#   interlingua.export.unsupported, so it is queryable and not just documented.
#
#   gen_ai.input.messages
#   gen_ai.output.messages
#   gen_ai.system_instructions
#   gen_ai.tool.definitions
#
#   For those, run the processor: https://github.com/Grace/genai-interlingua
#
# TWO THINGS TO KNOW BEFORE INSTALLING THIS
#
# 1. It does not detect anything. The processor scores every dialect against
#    the span and takes the winner; that needs a loop and a maximum, and OTTL
#    has neither. This config is pinned to vercel and scoped by the conditions
#    below, which only ask whether the span carries attributes of the right
#    shape. If more than one GenAI library reports into this pipeline, route
#    by service first -- these conditions will not tell them apart.
#
# 2. It does not compute interlingua.lossy. That list is per-span, derived
#    from what a given span turned out to carry. What is emitted instead is
#    interlingua.export.unsupported: the same statement made structurally,
#    about the config rather than about the span.

processors:
  transform/interlingua_vercel:
    # A span missing an attribute is the normal case, not an error.
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - attributes["ai.model.id"] != nil
          - attributes["ai.model.provider"] != nil
          - attributes["ai.operationId"] != nil
          - attributes["ai.response.finishReason"] != nil
          - attributes["ai.response.id"] != nil
          - attributes["ai.response.model"] != nil
          - attributes["ai.response.msToFirstChunk"] != nil
          - attributes["ai.settings.maxOutputTokens"] != nil
          - attributes["ai.telemetry.functionId"] != nil
          - attributes["ai.toolCall.args"] != nil
          - attributes["ai.toolCall.id"] != nil
          - attributes["ai.toolCall.name"] != nil
          - attributes["ai.toolCall.result"] != nil
          - attributes["ai.usage.completionTokens"] != nil
          - attributes["ai.usage.promptTokens"] != nil
          - attributes["ai.usage.tokens"] != nil
          - attributes["gen_ai.system"] != nil
        statements:
          - set(attributes["gen_ai.provider.name"], attributes["ai.model.provider"]) where attributes["ai.model.provider"] != nil
          - set(attributes["gen_ai.provider.name"], attributes["gen_ai.system"]) where attributes["ai.model.provider"] == nil and attributes["gen_ai.system"] != nil
          - set(attributes["gen_ai.provider.name"], ToLowerCase(attributes["gen_ai.provider.name"])) where attributes["gen_ai.provider.name"] != nil
          - replace_pattern(attributes["gen_ai.provider.name"], "\\..*$", "") where attributes["gen_ai.provider.name"] != nil
          - set(attributes["interlingua.__scratch"], "aws.bedrock") where attributes["gen_ai.provider.name"] == "amazon-bedrock"
          - set(attributes["interlingua.__scratch"], "azure.ai.openai") where attributes["gen_ai.provider.name"] == "azure"
          - set(attributes["interlingua.__scratch"], "gcp.gemini") where attributes["gen_ai.provider.name"] == "google"
          - set(attributes["interlingua.__scratch"], "gcp.vertex_ai") where attributes["gen_ai.provider.name"] == "google-vertex"
          - set(attributes["interlingua.__scratch"], "mistral_ai") where attributes["gen_ai.provider.name"] == "mistral"
          - set(attributes["interlingua.__scratch"], "x_ai") where attributes["gen_ai.provider.name"] == "xai"
          - set(attributes["gen_ai.provider.name"], attributes["interlingua.__scratch"]) where attributes["interlingua.__scratch"] != nil
          - delete_key(attributes, "interlingua.__scratch")
          - delete_key(attributes, "gen_ai.provider.name") where attributes["gen_ai.provider.name"] != nil and not IsMatch(attributes["gen_ai.provider.name"], "^(anthropic|aws\\.bedrock|azure\\.ai\\.inference|azure\\.ai\\.openai|cohere|deepseek|gcp\\.gemini|gcp\\.gen_ai|gcp\\.vertex_ai|groq|ibm\\.watsonx\\.ai|mistral_ai|moonshot_ai|openai|perplexity|x_ai)$")
          - set(attributes["gen_ai.operation.name"], attributes["ai.operationId"]) where attributes["ai.operationId"] != nil
          - replace_pattern(attributes["gen_ai.operation.name"], "\\.doGenerate$", "") where attributes["gen_ai.operation.name"] != nil
          - replace_pattern(attributes["gen_ai.operation.name"], "\\.doStream$", "") where attributes["gen_ai.operation.name"] != nil
          - replace_pattern(attributes["gen_ai.operation.name"], "\\.doEmbed$", "") where attributes["gen_ai.operation.name"] != nil
          - set(attributes["interlingua.__scratch"], "embeddings") where attributes["gen_ai.operation.name"] == "ai.embed"
          - set(attributes["interlingua.__scratch"], "embeddings") where attributes["gen_ai.operation.name"] == "ai.embedMany"
          - set(attributes["interlingua.__scratch"], "chat") where attributes["gen_ai.operation.name"] == "ai.generateObject"
          - set(attributes["interlingua.__scratch"], "chat") where attributes["gen_ai.operation.name"] == "ai.generateText"
          - set(attributes["interlingua.__scratch"], "chat") where attributes["gen_ai.operation.name"] == "ai.streamObject"
          - set(attributes["interlingua.__scratch"], "chat") where attributes["gen_ai.operation.name"] == "ai.streamText"
          - set(attributes["interlingua.__scratch"], "execute_tool") where attributes["gen_ai.operation.name"] == "ai.toolCall"
          - delete_key(attributes, "gen_ai.operation.name") where attributes["gen_ai.operation.name"] != nil and attributes["interlingua.__scratch"] == nil
          - set(attributes["gen_ai.operation.name"], attributes["interlingua.__scratch"]) where attributes["interlingua.__scratch"] != nil
          - delete_key(attributes, "interlingua.__scratch")
          - delete_key(attributes, "gen_ai.operation.name") where attributes["gen_ai.operation.name"] != nil and not IsMatch(attributes["gen_ai.operation.name"], "^(chat|create_agent|create_memory|create_memory_store|delete_memory|delete_memory_store|embeddings|execute_tool|fetch_response|generate_content|invoke_agent|invoke_workflow|plan|retrieval|search_memory|text_completion|update_memory|upsert_memory)$")
          - set(attributes["gen_ai.request.model"], attributes["ai.model.id"]) where attributes["gen_ai.request.model"] == nil and attributes["ai.model.id"] != nil
          - set(attributes["gen_ai.request.max_tokens"], attributes["ai.settings.maxOutputTokens"]) where attributes["gen_ai.request.max_tokens"] == nil and attributes["ai.settings.maxOutputTokens"] != nil
          - set(attributes["gen_ai.response.id"], attributes["ai.response.id"]) where attributes["gen_ai.response.id"] == nil and attributes["ai.response.id"] != nil
          - set(attributes["gen_ai.response.model"], attributes["ai.response.model"]) where attributes["gen_ai.response.model"] == nil and attributes["ai.response.model"] != nil
          - set(attributes["gen_ai.usage.input_tokens"], attributes["ai.usage.promptTokens"]) where attributes["gen_ai.usage.input_tokens"] == nil and attributes["ai.usage.promptTokens"] != nil
          - set(attributes["gen_ai.usage.input_tokens"], attributes["ai.usage.tokens"]) where attributes["gen_ai.usage.input_tokens"] == nil and attributes["ai.usage.promptTokens"] == nil and attributes["ai.usage.tokens"] != nil
          - set(attributes["gen_ai.usage.output_tokens"], attributes["ai.usage.completionTokens"]) where attributes["gen_ai.usage.output_tokens"] == nil and attributes["ai.usage.completionTokens"] != nil
          - set(attributes["gen_ai.response.finish_reasons"], attributes["ai.response.finishReason"]) where attributes["gen_ai.response.finish_reasons"] == nil and attributes["ai.response.finishReason"] != nil
          - set(attributes["interlingua.__scratch"], "content_filter") where attributes["gen_ai.response.finish_reasons"] == "content-filter"
          - set(attributes["interlingua.__scratch"], "tool_calls") where attributes["gen_ai.response.finish_reasons"] == "tool-calls"
          - set(attributes["gen_ai.response.finish_reasons"], attributes["interlingua.__scratch"]) where attributes["interlingua.__scratch"] != nil
          - delete_key(attributes, "interlingua.__scratch")
          - set(attributes["gen_ai.response.finish_reasons"], [attributes["gen_ai.response.finish_reasons"]]) where attributes["gen_ai.response.finish_reasons"] != nil
          - set(attributes["gen_ai.response.time_to_first_chunk"], attributes["ai.response.msToFirstChunk"]) where attributes["ai.response.msToFirstChunk"] != nil
          - set(attributes["gen_ai.response.time_to_first_chunk"], Double(attributes["gen_ai.response.time_to_first_chunk"]) / 1000) where attributes["gen_ai.response.time_to_first_chunk"] != nil and (IsDouble(attributes["gen_ai.response.time_to_first_chunk"]) or IsInt(attributes["gen_ai.response.time_to_first_chunk"]))
          - delete_key(attributes, "gen_ai.response.time_to_first_chunk") where attributes["gen_ai.response.time_to_first_chunk"] != nil and not (IsDouble(attributes["gen_ai.response.time_to_first_chunk"]) or IsInt(attributes["gen_ai.response.time_to_first_chunk"]))
          - set(attributes["gen_ai.workflow.name"], attributes["ai.telemetry.functionId"]) where attributes["ai.telemetry.functionId"] != nil
          - set(attributes["gen_ai.tool.name"], attributes["ai.toolCall.name"]) where attributes["ai.toolCall.name"] != nil
          - set(attributes["gen_ai.tool.call.id"], attributes["ai.toolCall.id"]) where attributes["ai.toolCall.id"] != nil
          - set(attributes["gen_ai.tool.call.arguments"], attributes["ai.toolCall.args"]) where attributes["ai.toolCall.args"] != nil
          - set(attributes["gen_ai.tool.call.result"], attributes["ai.toolCall.result"]) where attributes["ai.toolCall.result"] != nil
          - set(attributes["interlingua.dialect"], "vercel")
          - set(attributes["interlingua.target"], "genai-main")
          - set(attributes["interlingua.export"], "ottl")
          - set(attributes["interlingua.export.unsupported"], ["gen_ai.input.messages", "gen_ai.output.messages", "gen_ai.system_instructions", "gen_ai.tool.definitions"])
