# Builds a Collector containing this repository's processor and nothing else it
# does not need. Everything here is a core component, so the build needs no
# contrib module graph.
#
#   go run go.opentelemetry.io/collector/cmd/builder@v0.160.0 --config demo/builder-config.yaml
dist:
  name: interlingua-collector
  description: OpenTelemetry Collector with the genaiinterlingua processor
  output_path: ./demo/build
  otelcol_version: 0.160.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.160.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.160.0
  - gomod: github.com/Grace/genai-interlingua/processor/genaiinterlingua v0.0.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.160.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.160.0

replaces:
  - github.com/Grace/genai-interlingua/processor/genaiinterlingua => ../../processor/genaiinterlingua
  - github.com/Grace/genai-interlingua => ../..
