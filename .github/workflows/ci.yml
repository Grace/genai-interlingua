name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The core module has no go.sum because it has no dependencies.
          # Leaving the cache on would look for one and fail.
          cache: false

      # gofmt over tracked files rather than the tree: demo/build/ is generated
      # by ocb and gitignored, and its formatting is not this repository's
      # business.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"
            echo "$unformatted"
            gofmt -d $(git ls-files '*.go')
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # The seed corpus runs as part of `go test` above, which is most of the
      # value for free. This adds a short real fuzzing run, and only on pushes:
      # a fuzz find on a pull request would look like a flaky review rather than
      # the genuine result it is, and 60s is not long enough to be a gate.
      #
      # internal/normalize/otlp.go is hand-written and parses input from the
      # network. In a Collector a panic there takes down a pipeline carrying
      # every span in the service.
      - name: fuzz the OTLP codec
        if: github.event_name == 'push'
        run: go test ./internal/normalize -fuzz FuzzPayload -fuzztime=60s

      # Drift itself is already caught by the step above: TestConformanceTable
      # and the golden tests compare the committed bytes against freshly
      # generated ones and fail at the offending line. This step asserts the
      # weaker but separate property that regeneration is *idempotent* — that
      # -update writes back exactly what is committed. A generator with
      # unstable ordering would make the comparison tests flaky rather than
      # red, and flaky is the harder failure to read.
      #
      # It runs last because it mutates the tree.
      - name: regenerating is a no-op
        run: |
          go test ./internal/normalize -update
          if ! git diff --exit-code -- testdata/ docs/conformance.md; then
            echo "::error::-update was not idempotent; generated output is unstable"
            exit 1
          fi

      # The emitted OTTL configs are the artifact somebody pastes into their own
      # Collector, so they are committed and reviewed as a diff. Same idempotency
      # property as above, and the same reason: a generator with unstable output
      # makes the comparison flaky rather than red.
      - name: emitted OTTL configs are current
        run: |
          go test ./internal/emit/... -update
          if ! git diff --exit-code -- internal/emit/; then
            echo "::error::the emitted OTTL configs changed; commit them"
            exit 1
          fi

      # The semconv tables are generated from the vendored registries rather
      # than transcribed, so a re-vendor that nobody regenerated against is a
      # real and silent failure mode: the committed tables would describe an
      # upstream that no longer exists.
      #
      # TestGeneratedTablesAreCurrent catches the common case from inside the
      # suite. This catches the rest — a changed enum, a changed override, a
      # generator edit that was never run — by doing the regeneration here and
      # insisting nothing moved.
      - name: semconv tables match the vendored registries
        run: |
          go generate ./internal/semconv/...
          if ! git diff --exit-code -- internal/semconv/; then
            echo "::error::targets_gen.go is stale; run go generate ./internal/semconv/..."
            exit 1
          fi

  processor:
    name: processor module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processor/genaiinterlingua
    steps:
      - uses: actions/checkout@v4

      # Its own go.mod, because the processor needs the Collector's Go floor
      # (1.26) and the core module deliberately does not.
      - uses: actions/setup-go@v5
        with:
          go-version-file: processor/genaiinterlingua/go.mod
          cache-dependency-path: processor/genaiinterlingua/go.sum

      - name: go vet
        run: go vet ./...

      # TestMatchesTheCLIGoldens runs every fixture through pdata and compares
      # against the goldens the CLI committed, so this job is what keeps the two
      # entry points from drifting into two different normalizers.
      - name: go test
        run: go test -race ./...

  collector:
    name: collector builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: processor/genaiinterlingua/go.mod
          cache-dependency-path: processor/genaiinterlingua/go.sum

      # Proves the processor is registerable in a real Collector, not just that
      # it compiles as a library. A component that builds but cannot be wired
      # into a distribution is not a component.
      - name: build a collector with the processor in it
        run: |
          go install go.opentelemetry.io/collector/cmd/builder@v0.160.0
          builder --config demo/builder-config.yaml
          # `components` is the assertion that matters: it lists what the
          # binary actually registered. A processor that links but never
          # registers its factory would pass a plain build and fail here.
          ./demo/build/interlingua-collector components | tee /tmp/components.yaml
          grep -q 'name: genaiinterlingua' /tmp/components.yaml

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, processor, collector]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser builds the changelog from history, and a shallow clone
          # has none.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
