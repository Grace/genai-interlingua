name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The core module has no go.sum because it has no dependencies.
          # Leaving the cache on would look for one and fail.
          cache: false

      # gofmt over tracked files rather than the tree: demo/build/ is generated
      # by ocb and gitignored, and its formatting is not this repository's
      # business.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"
            echo "$unformatted"
            gofmt -d $(git ls-files '*.go')
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # wasm.go is the entry point behind the browser demo, and nothing else in
      # this job can see it: the gofmt step runs over tracked files but the
      # build tag excludes it from `go vet ./...` on linux. It calls the same
      # normalize.Payload the CLI does, so a signature change would leave this
      # whole suite green and the published demo unbuildable.
      - name: the WebAssembly entry point still builds
        run: |
          GOOS=js GOARCH=wasm go build -o /dev/null .
          GOOS=js GOARCH=wasm go vet ./...

      - name: go test
        run: go test -race ./...

      # The seed corpus runs as part of `go test` above, which is most of the
      # value for free. This adds a short real fuzzing run, and only on pushes:
      # a fuzz find on a pull request would look like a flaky review rather than
      # the genuine result it is, and 60s is not long enough to be a gate.
      #
      # internal/normalize/otlp.go is hand-written and parses input from the
      # network. In a Collector a panic there takes down a pipeline carrying
      # every span in the service.
      - name: fuzz the OTLP codec
        if: github.event_name == 'push'
        run: go test ./internal/normalize -fuzz FuzzPayload -fuzztime=60s

      # Drift itself is already caught by the step above: TestConformanceTable
      # and the golden tests compare the committed bytes against freshly
      # generated ones and fail at the offending line. This step asserts the
      # weaker but separate property that regeneration is *idempotent* — that
      # -update writes back exactly what is committed. A generator with
      # unstable ordering would make the comparison tests flaky rather than
      # red, and flaky is the harder failure to read.
      #
      # It runs last because it mutates the tree.
      - name: regenerating is a no-op
        run: |
          go test ./internal/normalize -update
          if ! git diff --exit-code -- testdata/ docs/conformance.md; then
            echo "::error::-update was not idempotent; generated output is unstable"
            exit 1
          fi

      # The emitted OTTL configs are the artifact somebody pastes into their own
      # Collector, so they are committed and reviewed as a diff. Same idempotency
      # property as above, and the same reason: a generator with unstable output
      # makes the comparison flaky rather than red.
      - name: emitted configs and the export gap table are current
        run: |
          go test ./internal/emit/... -update
          if ! git diff --exit-code -- internal/emit/ docs/export-gap.md; then
            echo "::error::emitted configs or docs/export-gap.md changed; commit them"
            exit 1
          fi

      # The semconv tables are generated from the vendored registries rather
      # than transcribed, so a re-vendor that nobody regenerated against is a
      # real and silent failure mode: the committed tables would describe an
      # upstream that no longer exists.
      #
      # TestGeneratedTablesAreCurrent catches the common case from inside the
      # suite. This catches the rest — a changed enum, a changed override, a
      # generator edit that was never run — by doing the regeneration here and
      # insisting nothing moved.
      - name: semconv tables match the vendored registries
        run: |
          go generate ./internal/semconv/...
          if ! git diff --exit-code -- internal/semconv/; then
            echo "::error::targets_gen.go is stale; run go generate ./internal/semconv/..."
            exit 1
          fi

  processor:
    name: processor module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processor/genaiinterlingua
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Its own go.mod, because the processor needs the Collector's Go floor
      # (1.26) and the core module deliberately does not.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: processor/genaiinterlingua/go.mod
          cache-dependency-path: processor/genaiinterlingua/go.sum

      - name: go vet
        run: go vet ./...

      # TestMatchesTheCLIGoldens runs every fixture through pdata and compares
      # against the goldens the CLI committed, so this job is what keeps the two
      # entry points from drifting into two different normalizers.
      - name: go test
        run: go test -race ./...

  collector:
    name: collector builds
    runs-on: ubuntu-latest
    # setup-go v6 began setting GOTOOLCHAIN=local, which forbids Go from ever
    # fetching a toolchain. That is the right default for the other two jobs,
    # which build modules whose go directives this repository writes. It is the
    # wrong one here: ocb *generates* a module below and fills it with Collector
    # dependencies whose own go directives are not ours to control, so one of
    # them asking for a newer toolchain would turn a download into a build
    # failure. auto is what setup-go v5 did, and this keeps it rather than
    # letting a runtime bump change what the job means.
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: processor/genaiinterlingua/go.mod
          cache-dependency-path: processor/genaiinterlingua/go.sum

      # Proves the processor is registerable in a real Collector, not just that
      # it compiles as a library. A component that builds but cannot be wired
      # into a distribution is not a component.
      - name: build a collector with the processor in it
        run: |
          go install go.opentelemetry.io/collector/cmd/builder@v0.160.0
          builder --config demo/builder-config.yaml
          # `components` is the assertion that matters: it lists what the
          # binary actually registered. A processor that links but never
          # registers its factory would pass a plain build and fail here.
          ./demo/build/interlingua-collector components | tee /tmp/components.yaml
          grep -q 'name: genaiinterlingua' /tmp/components.yaml

      # The emitted OTTL is checked twice, for two different things.
      #
      # validate.sh asks whether it parses. A generated config that has only
      # ever been compared against a golden file has not been tested, it has
      # been photographed.
      #
      # equivalence.sh asks the question that actually matters: run every
      # fixture through the processor and through a Collector configured with
      # the exported config, and see whether they agree. On its first run it
      # found four real bugs -- a list wrapped twice, a lookup table that never
      # fired on array values, an enum guard deleting attributes the processor
      # preserves, and a header claiming coverage it did not have.
      - name: the emitted OTTL parses
        run: bash internal/emit/ottl/testdata/validate.sh

      - name: the emitted OTTL means what the processor means
        run: bash internal/emit/ottl/testdata/equivalence.sh

  # Every commit must carry a Signed-off-by trailer certifying the DCO.
  # Hand-rolled rather than a marketplace action: it is a dozen lines, and a
  # repository whose core module has no dependencies at all should not pull a
  # third party into CI to read a git trailer.
  dco:
    name: sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check sign-off
        env:
          # A push reports the range it advanced; a pull request reports its own
          # base and head. Both are ranges, so the walk below is the same.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A new branch, a tag, or the first push to a repository reports an
          # all-zero base that names no commit, so there is no range to walk.
          # Check the tip alone rather than failing on a git error, which would
          # read as a sign-off problem when it is not one.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range=$(git rev-list --no-merges "$BASE".."$HEAD")
          else
            echo "::notice::no usable base for this event; checking the tip commit only"
            range=$(git rev-list --no-merges -1 "$HEAD")
          fi
          missing=0
          # --no-merges: a merge commit carries no sign-off trailer and cannot be
          # given one without rewriting the merge, so flagging it would produce a
          # failure with no remedy the printed advice can fix.
          for sha in $range; do
            if ! git log -1 --format=%B "$sha" | git interpret-trailers --parse | grep -qi '^Signed-off-by:'; then
              echo "::error::missing Signed-off-by: $sha $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with 'git commit -s'. To fix the most recent commit:"
            echo "  git commit -s --amend --no-edit && git push --force-with-lease"
            echo "For several, rebase and sign off each. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits signed off."

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, processor, collector]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser builds the changelog from history, and a shallow clone
          # has none.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  inspector:
    name: the demo inspector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demos/inspector/package-lock.json

      # The page is TypeScript over the WASM build of this repository, and until
      # this job existed nothing in CI compiled it. A broken inspector could land
      # on main with every check green, which is close to what happened: a Go nil
      # slice encodes as null, the page read .length off it, React unmounted the
      # whole tree, and one capture rendered a blank document. The types said the
      # field was an array and were believed -- a declaration about what crosses a
      # JSON boundary is a claim, not a check.
      # The inspector shows a note beside every span name, from demos/spans.json.
      # samples.py refuses to write when a fixture span has no note or a note
      # names a span no fixture carries, so a re-capture that adds or renames a
      # span fails here instead of reaching the page unexplained.
      - name: span notes cover every fixture span
        run: python3 demos/samples.py "$RUNNER_TEMP/samples.js"

      - name: typecheck and build
        working-directory: demos/inspector
        run: |
          npm ci
          npm run typecheck
          npm run build
